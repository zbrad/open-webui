[project]
name = "open-webui"
description = "Open WebUI"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "itsdangerous",

    "python-socketio",
    "orjson",
    "cryptography",
    "bcrypt",
    "argon2-cffi",
    "PyJWT[crypto]",
    "authlib",
    "joserfc",

    "requests",
    "aiohttp!=3.13.3", # do not update to 3.13.3 - broken
    "aiodns<4", # keep below 4.x: pulls pycares 5 (c-ares 1.34.6) which breaks DNS on some hosts (#28013, #28215); opt-in via AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER
    "async-timeout",
    "aiocache",
    "aiofiles",
    "starlette-compress",
    "Brotli",
    "brotlicffi",
    "httpx[socks,http2,zstd,cli,brotli]",
    "starsessions[redis]",
    "python-mimeparse",

    "sqlalchemy[asyncio]",
    "aiosqlite",
    "psycopg[binary]",
    "alembic",

    "pycrdt",
    "redis",
    "hiredis",
    # "valkey-glide-sync==2.3.1",  # optional: install manually if VECTOR_DB=valkey

    "pytz",
    "APScheduler",
    "RestrictedPython",

    "loguru",
    "asgiref",

    "tiktoken",
    "regex",
    "mcp<2", # 2.x renamed streamablehttp_client -> streamable_http_client and changed its signature (httpx_client_factory -> a prebuilt httpx2.AsyncClient); utils/mcp/client.py isn't ported to it yet

    "openai",
    "anthropic",
    "google-genai",

    "langchain",
    "langchain-community",
    "langchain-classic",
    "langchain-text-splitters",

    "fake-useragent",
    "chromadb",
    "opensearch-py",
    "PyMySQL",
    "boto3",
    
    "transformers",
    "sentence-transformers",
    "accelerate",
    "pyarrow<21", # keep below 21 for rpi compatibility #15897
    "einops",

    "ftfy",
    "chardet",
    "pypdf",
    "fpdf2",
    "pymdown-extensions",
    "docx2txt",
    "python-docx",
    "python-pptx",
    "msoffcrypto-tool",
    "nltk",
    "Markdown",
    "beautifulsoup4",
    "lxml",
    "pypandoc",
    "pandas",
    "openpyxl",
    "pyxlsb",
    "xlrd",
    "validators",
    "psutil",
    "sentencepiece",
    "soundfile",
    "azure-ai-documentintelligence",

    "pillow",
    "opencv-python-headless",
    "rapidocr",
    "rank-bm25",

    "onnxruntime",
    "faster-whisper",

    "black",
    "youtube-transcript-api",
    "pytube",

    "pydub",
    "audioop-lts; python_version >= '3.13'", # stdlib audioop was removed in 3.13 (PEP 594); pydub needs this backport
    "ddgs",

    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",

    "googleapis-common-protos",
    "google-cloud-storage",

    "azure-identity",
    "azure-storage-blob",

    "ldap3",
]
readme = "README.md"
requires-python = ">= 3.14"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary",
    "pgvector",
]
mariadb = [
    "mariadb",
]
unstructured = [
    "unstructured",
]

all = [
    "pymongo",
    "psycopg2-binary",
    "pgvector",
    "playwright", # Caution: keep in sync with docker-compose.playwright.yaml's pinned image/CLI version
    "elasticsearch",

    "qdrant-client",
    
    "weaviate-client",
    "pymilvus",
    "pinecone",
    "oracledb",
    "colbert-ai",

    "azure-search-documents",
    "unstructured",
]

[project.scripts]
open-webui = "open_webui:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".webui_secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "webui.db",
    "chroma.sqlite3",
]
force-include = { "CHANGELOG.md" = "open_webui/CHANGELOG.md", build = "open_webui/frontend" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "Q",    # flake8-quotes
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 10
pydocstyle.convention = "google"
